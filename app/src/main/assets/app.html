<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Frase</title>
<style>
:root{
  --sheet:#DDE2DC; --hi:#E8ECE6; --grid:#C7D0C6; --gridb:#B4C0B3;
  --graf:#1E2422; --lap:#5E6A63; --carga:#A63A24; --tinta:#2A4C6B;
  --ok:#2E6B4F;
  --mono:ui-monospace,"Roboto Mono",monospace;
  --cond:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --ser:Georgia,"Noto Serif",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--sheet);
  background-image:
    repeating-linear-gradient(0deg,transparent 0 19px,var(--grid) 19px 20px),
    repeating-linear-gradient(90deg,transparent 0 19px,var(--grid) 19px 20px),
    repeating-linear-gradient(0deg,transparent 0 99px,var(--gridb) 99px 100px),
    repeating-linear-gradient(90deg,transparent 0 99px,var(--gridb) 99px 100px);
  color:var(--graf); font-family:var(--cond);
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top);
}

/* вкладки */
nav{display:flex;border-bottom:1.5px solid var(--graf);flex:none}
nav button{
  flex:1;background:transparent;border:0;padding:14px 2px 12px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--lap);cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-1.5px;
}
th{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--lap);text-align:left;
  padding:0 4px 7px;border-bottom:1.5px solid var(--graf);font-weight:400;
}
td.c{font-family:var(--ser);font-weight:700;color:var(--carga);text-align:left}
td.n{font-size:14px;color:var(--graf)}
.verb .sub{font-family:var(--mono);font-size:10px;color:var(--carga);letter-spacing:.08em}
.gh{font-family:var(--ser);font-size:19px;line-height:1.25;color:var(--graf);flex:1;text-align:left}
nav button.on{color:var(--graf);border-bottom-color:var(--carga);font-weight:700}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
section{display:none;animation:in .22s ease-out}
section.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  color:var(--lap);text-transform:uppercase;padding:16px 0 0;
  display:flex;justify-content:space-between
}
.eyebrow b{color:var(--graf)}

/* ---------- карточка ---------- */
.vista{
  width:84px;height:84px;margin:14px auto 4px;display:grid;place-items:center;
  font-size:44px;background:var(--hi);border:1.5px solid var(--graf);position:relative
}
.vista::after{
  content:"вид";position:absolute;bottom:-9px;right:-1px;background:var(--sheet);
  padding:0 4px;font-family:var(--mono);font-size:9px;color:var(--lap)
}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:0 14px;margin-top:24px}
.tok{display:flex;flex-direction:column;align-items:center;max-width:150px}
.tok .w{font-family:var(--ser);font-size:clamp(24px,7.6vw,34px);line-height:1.15;padding-bottom:3px}
.tok.k .w{color:var(--carga);font-weight:700}
.tok .lead{width:1px;background:var(--lap)}
.tok:nth-child(odd) .lead{height:20px}
.tok:nth-child(even) .lead{height:36px}
.tok .role{
  font-family:var(--mono);font-size:9px;line-height:1.35;color:var(--lap);
  text-align:center;text-transform:uppercase;border-top:1px solid var(--lap);
  padding-top:4px;max-width:130px
}
.tok.k .role{color:var(--carga);border-top-color:var(--carga)}

.dim{margin-top:28px;display:flex;align-items:center;gap:6px;color:var(--tinta);font-family:var(--mono);font-size:9px}
.dim .bar{flex:1;height:1px;background:var(--tinta)}
.dim .cap{width:1px;height:9px;background:var(--tinta)}
.ru{text-align:center;padding-top:9px;font-size:18px;color:var(--tinta);min-height:28px}
.ru.hid{visibility:hidden}
.say{text-align:center;font-family:var(--mono);font-size:11.5px;color:var(--lap);margin-top:5px}
.nota{border-left:2.5px solid var(--carga);background:rgba(232,236,230,.75);padding:10px 12px;margin-top:20px}
.nota span{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--carga);text-transform:uppercase;display:block;margin-bottom:3px}
.nota p{font-size:14.5px;line-height:1.45}

/* кнопки */
.row{display:flex;gap:10px;margin-top:22px}
button.b{
  flex:1;font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:14px 8px;border:1.5px solid var(--graf);
  background:var(--hi);color:var(--graf);cursor:pointer
}
button.b:active{background:var(--graf);color:var(--hi)}
button.b.pri{background:var(--graf);color:var(--hi)}
button.b.pri:active{background:var(--carga);border-color:var(--carga)}
button.b:focus-visible{outline:2px solid var(--carga);outline-offset:2px}

/* ---------- путь ---------- */
.hdr{margin-top:18px;padding-bottom:16px;border-bottom:1.5px solid var(--graf)}
.hdr .big{font-family:var(--ser);font-size:27px;line-height:1.2}
.hdr .small{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--lap);margin-top:6px}
.barra{height:5px;background:var(--grid);margin-top:12px;position:relative}
.barra i{position:absolute;left:0;top:0;bottom:0;background:var(--carga)}

.niv{border:1.5px solid var(--graf);background:var(--hi);margin-top:12px;
  display:flex;align-items:stretch;cursor:pointer;text-align:left;width:100%;padding:0}
.niv .no{width:52px;flex:none;display:grid;place-items:center;
  font-family:var(--ser);font-size:23px;border-right:1.5px solid var(--graf);color:var(--graf)}
.niv .mid{flex:1;padding:12px 13px}
.niv .tt{font-family:var(--ser);font-size:18px;line-height:1.2}
.niv .ds{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;
  color:var(--lap);margin-top:5px;text-transform:uppercase}
.niv .st{width:56px;flex:none;display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;color:var(--lap);border-left:1px solid var(--grid)}
.niv.hecho{border-color:var(--ok)}
.niv.hecho .no{color:var(--ok);border-right-color:var(--ok)}
.niv.hecho .st{color:var(--ok);font-weight:700}
.niv.ahora{border-width:2.5px;border-color:var(--carga)}
.niv.ahora .no{color:var(--carga)}
.niv.cerrado{opacity:.42}
.niv.cerrado .no{color:var(--lap)}

/* экзамен */
.exHdr{display:flex;justify-content:space-between;align-items:baseline;
  margin-top:18px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--lap)}
.exHdr b{color:var(--carga)}
.exQ{font-family:var(--ser);font-size:clamp(21px,6.4vw,27px);line-height:1.3;
  text-align:center;margin-top:26px;color:var(--graf)}
.exSub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--lap);text-align:center;margin-top:9px}
.opt{width:100%;display:block;text-align:left;margin-top:9px;padding:13px 15px;
  border:1.5px solid var(--graf);background:var(--hi);color:var(--graf);
  font-family:var(--ser);font-size:17px;cursor:pointer}
.opt:active{background:var(--graf);color:var(--hi)}
.opt.ok{border-color:var(--ok);color:var(--ok);background:rgba(46,107,79,.1)}
.opt.no{border-color:var(--carga);color:var(--carga);background:rgba(166,58,36,.09)}
.opt.off{pointer-events:none;opacity:.55}
.fin{text-align:center;margin-top:40px}
.fin .cifra{font-family:var(--ser);font-size:58px;line-height:1}
.fin .cifra.ok{color:var(--ok)} .fin .cifra.no{color:var(--carga)}
.fin .txt{font-size:17px;line-height:1.5;margin-top:14px}
.fallos{margin-top:22px;text-align:left}
.fallos h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--carga);margin-bottom:8px}
.fallos li{list-style:none;font-family:var(--ser);font-size:15px;line-height:1.6;
  border-left:2px solid var(--grid);padding-left:10px;margin-top:4px}

/* динамик */
.spk{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border:1.5px solid var(--graf);background:var(--hi);
  color:var(--graf);font-size:15px;cursor:pointer;flex:none
}
.spk:active{background:var(--carga);border-color:var(--carga);color:var(--hi)}
.lin{font-family:var(--ser);font-size:19px;line-height:1.75;margin-top:14px}
.pal{cursor:pointer;border-bottom:1px dotted transparent;padding:1px 0}
.pal:active{background:var(--carga);color:var(--hi)}
.linru{font-family:var(--cond);font-size:14.5px;line-height:1.45;
  color:var(--tinta);margin-top:4px;padding-left:11px;border-left:2px solid var(--grid)}
#txPop{position:sticky;bottom:6px;margin-top:20px;padding:13px 15px;
  background:var(--graf);color:var(--hi);font-size:16px;
  opacity:0;transform:translateY(8px);transition:.16s;pointer-events:none}
#txPop.show{opacity:1;transform:none}
#txPop b{font-family:var(--ser);font-size:19px;color:#E8B4A0}
.vel{display:flex;justify-content:center;margin-top:12px}
.vel button{
  background:transparent;border:1.5px solid var(--grid);color:var(--lap);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 13px;cursor:pointer
}
.vel button+button{border-left:0}
.vel button.on{background:var(--graf);border-color:var(--graf);color:var(--hi)}
.spk.wide{width:auto;padding:0 16px;height:40px;font-family:var(--cond);
  font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;gap:7px}
.tok .w{cursor:pointer}
td.f{cursor:pointer}

/* подрежимы */
.sub2{display:flex;border:1.5px solid var(--graf);margin-top:16px}
.sub2 button{flex:1;background:transparent;border:0;padding:12px 4px;
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--lap);cursor:pointer}
.sub2 button+button{border-left:1.5px solid var(--graf)}
.sub2 button.on{background:var(--graf);color:var(--hi)}

/* тренажёр хвостов */
.stem{font-family:var(--ser);font-size:clamp(30px,10vw,42px);text-align:center;
  margin-top:26px;color:var(--graf);letter-spacing:.01em}
.stem u{text-decoration:none;color:var(--carga);border-bottom:2.5px solid var(--carga);padding:0 2px}
.who{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--lap);text-align:center;margin-top:10px}
.hint{font-size:14px;color:var(--lap);text-align:center;margin-top:6px}

/* ---------- глаголы ---------- */
.verb{border:1.5px solid var(--graf);background:var(--hi);margin-top:14px}
.verb>.top{width:100%;display:flex;align-items:baseline;gap:10px;padding:14px;background:transparent;border:0;cursor:pointer;text-align:left}
.verb .inf{font-family:var(--ser);font-size:24px;color:var(--graf)}
.verb .tr{font-size:14px;color:var(--lap);flex:1}
.verb .arrow{font-family:var(--mono);font-size:14px;color:var(--carga)}
.verb .body{display:none;padding:0 14px 16px;border-top:1px solid var(--grid)}
.verb.open .body{display:block}
.verb.now{border-color:var(--carga);border-width:2px}
.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--carga);border:1px solid var(--carga);padding:2px 5px}

table{width:100%;border-collapse:collapse;margin-top:12px}
td{padding:7px 4px;border-bottom:1px solid var(--grid);font-size:15px;vertical-align:baseline}
td.q{color:var(--lap);width:32%;font-size:13.5px}
td.f{font-family:var(--ser);font-weight:700;color:var(--carga);width:32%}
td.p{font-family:var(--mono);font-size:11.5px;color:var(--lap)}
.corto{font-size:14.5px;line-height:1.5;margin-top:13px;color:var(--graf)}
.more{margin-top:14px;width:100%;background:transparent;border:0;border-top:1px dashed var(--lap);padding-top:11px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta);cursor:pointer;text-align:left}
.largo{display:none;margin-top:6px}
.verb.full .largo{display:block}
.blk{margin-top:16px}
.blk h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--carga);text-transform:uppercase;margin-bottom:7px}
.blk li{list-style:none;font-family:var(--ser);font-size:15.5px;line-height:1.65;border-left:2px solid var(--grid);padding-left:10px}
.blk .cm{font-size:14px;line-height:1.5;color:var(--lap);font-family:var(--cond);margin-top:8px}

/* ---------- конструктор ---------- */
.lvl{display:flex;gap:0;margin-top:16px;border:1.5px solid var(--graf)}
.lvl button{flex:1;background:transparent;border:0;padding:11px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--lap);cursor:pointer}
.lvl button+button{border-left:1.5px solid var(--graf)}
.lvl button.on{background:var(--graf);color:var(--hi)}

.task{margin-top:24px;font-size:20px;color:var(--tinta);text-align:center;line-height:1.35}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px;min-height:52px}
.slot{
  min-width:60px;padding:10px 12px;border-bottom:2px solid var(--lap);
  font-family:var(--ser);font-size:20px;text-align:center;background:transparent;
  border-top:0;border-left:0;border-right:0;color:var(--graf);cursor:pointer
}
.slot.empty{color:transparent;background:rgba(255,255,255,.28)}
.slot.fix{border-bottom-color:var(--grid);color:var(--lap);cursor:default}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:26px}
.chip{
  font-family:var(--ser);font-size:18px;padding:9px 14px;
  border:1.5px solid var(--graf);background:var(--hi);color:var(--graf);cursor:pointer
}
.chip:active{background:var(--graf);color:var(--hi)}
.chip.used{opacity:.25;pointer-events:none}
input.free{
  width:100%;margin-top:22px;padding:14px 12px;border:1.5px solid var(--graf);
  background:var(--hi);font-family:var(--ser);font-size:20px;color:var(--graf);text-align:center
}
input.free:focus{outline:none;border-color:var(--carga)}
.res{margin-top:18px;padding:12px;font-size:15px;line-height:1.45;display:none}
.res.show{display:block}
.res.good{background:rgba(46,107,79,.12);border-left:3px solid var(--ok);color:var(--ok)}
.res.bad{background:rgba(166,58,36,.1);border-left:3px solid var(--carga);color:var(--carga)}
.res b{font-family:var(--ser);font-size:17px}
.score{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--lap);text-align:center;margin-top:18px;text-transform:uppercase}
</style>
</head>
<body>

<nav>
  <button data-go="ruta" class="on">Путь</button>
  <button data-go="ficha">Фраза</button>
  <button data-go="gram">Правила</button>
  <button data-go="verbos">Глаголы</button>
  <button data-go="taller">Практика</button>
</nav>

<main>

<!-- ============ ПУТЬ ============ -->
<section id="ruta" class="on">
  <div id="rutaLista">
    <div class="hdr">
      <div class="big" id="rTit">—</div>
      <div class="small" id="rSub">—</div>
      <div class="barra"><i id="rBar" style="width:0%"></i></div>
    </div>
    <div id="rNiv"></div>
    <div class="score" id="rPie" style="margin-bottom:8px"></div>
  </div>

  <div id="rutaDet" hidden></div>
  <div id="rutaEx" hidden></div>
</section>

<!-- ============ ФРАЗА ============ -->
<section id="ficha">
  <div class="eyebrow"><span>ficha <b id="num">—</b></span><span id="tema">—</span></div>
  <div class="vista" id="emo">🏗️</div>
  <div class="words" id="words"></div>
  <div class="dim"><span class="cap"></span><span class="bar"></span><span>перевод</span><span class="bar"></span><span class="cap"></span></div>
  <div class="ru hid" id="ru"></div>
  <div class="say" id="say"></div>
  <div style="display:flex;justify-content:center;margin-top:16px">
    <button class="spk wide" id="bSay">🔊 Произнести</button>
  </div>
  <div class="vel" id="vel">
    <button data-v="0.55">медленно</button>
    <button data-v="0.7" class="on">обычно</button>
    <button data-v="0.9">быстро</button>
  </div>
  <div class="nota"><span>примечание</span><p id="nota"></p></div>
  <div class="row">
    <button class="b" id="bRu">Перевод</button>
    <button class="b pri" id="bNext">Следующая</button>
  </div>
</section>

<!-- ============ ПРАВИЛА ============ -->
<section id="gram">
  <div class="eyebrow"><span>gramática</span><span>как устроен язык</span></div>
  <div id="gramList"></div>
</section>

<!-- ============ ГЛАГОЛЫ ============ -->
<section id="verbos">
  <div class="eyebrow"><span>verbos</span><span>таблицы спряжения</span></div>
  <div id="verbList"></div>
</section>

<!-- ============ СОБРАТЬ ============ -->
<section id="taller">
  <div class="eyebrow"><span>taller</span><span>сборка фразы</span></div>
  <div class="sub2" id="modo">
    <button data-m="fr" class="on">Фразы</button>
    <button data-m="cj">Хвосты</button>
    <button data-m="wd">Слова</button>
    <button data-m="tx">Чтение</button>
  </div>

  <div id="paneFr">
    <div class="lvl">
      <button data-lvl="1" class="on">Легко</button>
      <button data-lvl="2">Средне</button>
      <button data-lvl="3">Сложно</button>
    </div>
    <div class="task" id="task">—</div>
    <div id="area"></div>
    <div class="res" id="res"></div>
    <div class="row">
      <button class="b" id="bCheck">Проверить</button>
      <button class="b pri" id="bSkip">Следующее</button>
    </div>
    <div class="score" id="score">верно 0 · всего 0</div>
  </div>

  <div id="paneCj" hidden>
    <div class="stem" id="cjStem">—</div>
    <div class="who" id="cjWho">—</div>
    <div class="hint" id="cjHint"></div>
    <div class="chips" id="cjChips"></div>
    <div class="res" id="cjRes"></div>
    <button class="more" id="cjTogg">↓ Показать таблицу</button>
    <div id="cjAyuda" hidden></div>
    <div class="row"><button class="b pri" id="cjNext">Следующий</button></div>
    <div class="score" id="cjScore">верно 0 · всего 0</div>
  </div>

  <div id="paneWd" hidden>
    <div class="exSub" id="wdCaja" style="margin-top:18px">—</div>
    <div class="exQ" id="wdPregunta">—</div>
    <div class="exSub" id="wdSub">—</div>
    <div id="wdArea" style="margin-top:22px"></div>
    <div class="res" id="wdRes"></div>
    <div class="row"><button class="b pri" id="wdNext">Следующее слово</button></div>
    <div class="score" id="wdScore">—</div>
  </div>

  <div id="paneTx" hidden>
    <div class="exSub" id="txCaja" style="margin-top:18px">—</div>
    <div class="hdr" style="margin-top:8px;border-bottom:0;padding-bottom:0">
      <div class="big" id="txTit">—</div>
    </div>
    <div id="txCuerpo"></div>
    <div id="txPop"></div>
    <div class="row">
      <button class="b" id="txRu">Перевод</button>
      <button class="b" id="txOir">🔊</button>
      <button class="b pri" id="txNext">Дальше</button>
    </div>
    <div class="score">тапните любое слово — покажу перевод и произнесу</div>
  </div>
</section>

</main>

<script>
/* ================= ДАННЫЕ ================= */

/* озвучка: сначала мост в Android, если нет — браузерный синтезатор */
let VEL=0.7;
try{ const g=localStorage.getItem("frase_vel"); if(g) VEL=parseFloat(g); }catch(e){}

function ponVel(v){
  VEL=v;
  try{ localStorage.setItem("frase_vel",String(v)); }catch(e){}
  try{ if(window.Android && window.Android.velocidad) window.Android.velocidad(v); }catch(e){}
}

/* ждём, пока синтезатор договорит, и только потом идём дальше */
let _cb=null, _reloj=null;

window.__vozFin=function(){
  if(!_cb) return;
  const f=_cb; _cb=null;
  clearTimeout(_reloj);
  setTimeout(f, 260);
};

function corta(){ _cb=null; clearTimeout(_reloj); }

function diY(txt, fn, extra){
  corta();
  if(!txt){ _reloj=setTimeout(fn, extra||900); return; }
  _cb=()=>{ if(extra) setTimeout(fn, extra); else fn(); };
  di(txt);
  // страховка: если сигнал не придёт, идём по расчётному времени
  const tope = 1600 + String(txt).length*90 + (extra||0);
  _reloj = setTimeout(()=>{ const f=_cb; _cb=null; if(f) f(); }, tope);
}

function di(txt){
  if(!txt) return;
  const limpio=String(txt).replace(/[¿¡]/g,"").trim();
  if(!limpio) return;
  try{
    if(window.Android && window.Android.hablar){ window.Android.hablar(limpio); return; }
  }catch(e){}
  try{
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
      // пауза-прогрев: браузерный синтезатор тоже срезает начало
      // беззвучная фраза-прогрев: даёт реальную длительность,
      // за которую Bluetooth успевает открыть канал
      const antes=new SpeechSynthesisUtterance("uno dos");
      antes.lang="es-ES"; antes.volume=0; antes.rate=0.6;
      window.speechSynthesis.speak(antes);

      const u=new SpeechSynthesisUtterance(limpio);
      u.lang="es-ES"; u.rate=VEL;
      window.speechSynthesis.speak(u);

      const despues=new SpeechSynthesisUtterance("uno dos");
      despues.lang="es-ES"; despues.volume=0; despues.rate=0.6;
      despues.onend=()=>{ if(window.__vozFin) window.__vozFin(); };
      window.speechSynthesis.speak(despues);
    }
  }catch(e){}
}

/* ================= ФРАЗА ================= */
let fi=Math.floor(Math.random()*FRASES.length), abierto=false;

function pintaFicha(){
  const c=FRASES[fi];
  $("num").textContent=String(fi+1).padStart(2,"0")+"/"+FRASES.length;
  $("tema").textContent=c.t;
  $("emo").textContent=c.e;
  const box=$("words"); box.innerHTML="";
  c.w.forEach(([w,role,k])=>{
    const d=document.createElement("div");
    d.className="tok"+(k?" k":"");
    const a=document.createElement("span"); a.className="w"; a.textContent=w;
    a.onclick=()=>di(w);
    const b=document.createElement("span"); b.className="lead";
    const e=document.createElement("span"); e.className="role"; e.textContent=role;
    d.append(a,b,e); box.appendChild(d);
  });
  $("ru").textContent=c.ru; $("ru").classList.add("hid");
  $("say").textContent=c.say; $("nota").textContent=c.n;
  abierto=false; $("bRu").textContent="Перевод";
}
$("bSay").onclick=()=>di(FRASES[fi].w.map(x=>x[0]).join(" "));
$("bRu").onclick=()=>{abierto=!abierto;$("ru").classList.toggle("hid",!abierto);$("bRu").textContent=abierto?"Скрыть":"Перевод";};
$("bNext").onclick=()=>{let n;do{n=Math.floor(Math.random()*FRASES.length)}while(n===fi);fi=n;pintaFicha();document.querySelector("main").scrollTop=0;};
document.querySelectorAll("#vel button").forEach(b=>{
  const v=parseFloat(b.dataset.v);
  document.querySelectorAll("#vel button").forEach(x=>{
    if(Math.abs(parseFloat(x.dataset.v)-VEL)<0.01) x.classList.add("on");
    else x.classList.remove("on");
  });
  b.onclick=()=>{
    document.querySelectorAll("#vel button").forEach(x=>x.classList.toggle("on",x===b));
    ponVel(v);
    di(FRASES[fi].w.map(x=>x[0]).join(" "));

(function(){
  const L=$("verbList");
  VERBOS.forEach(v=>{
    const card=document.createElement("div");
    card.className="verb"+(v.now?" now":"");

    const top=document.createElement("button"); top.className="top";
    top.innerHTML='<span class="inf"></span><span class="tr"></span>'+
                  (v.now?'<span class="tag">учим сейчас</span>':'')+
                  '<span class="arrow">+</span>';
    top.querySelector(".inf").textContent=v.inf;
    top.querySelector(".tr").textContent=v.tr;

    const body=document.createElement("div"); body.className="body";
    const tb=document.createElement("table");
    v.f.forEach(([q,f,p])=>{
      const tr=document.createElement("tr");
      const a=document.createElement("td"); a.className="q"; a.textContent=q;
      const b=document.createElement("td"); b.className="f"; b.textContent=f;
      b.onclick=()=>di(f);
      const c=document.createElement("td"); c.className="p"; c.textContent=p;
      tr.append(a,b,c); tb.appendChild(tr);
    });
    const corto=document.createElement("p"); corto.className="corto"; corto.textContent=v.corto;
    const more=document.createElement("button"); more.className="more"; more.textContent="↓ Подробно, с примерами";
    const largo=document.createElement("div"); largo.className="largo";

    v.largo.forEach(([h,ex,cm])=>{
      const blk=document.createElement("div"); blk.className="blk";
      const t=document.createElement("h4"); t.textContent=h; blk.appendChild(t);
      const ul=document.createElement("ul");
      ex.forEach(s=>{const li=document.createElement("li");li.textContent=s;ul.appendChild(li);});
      blk.appendChild(ul);
      if(cm){const p=document.createElement("p");p.className="cm";p.textContent=cm;blk.appendChild(p);}
      largo.appendChild(blk);
    });

    body.append(tb,corto,more,largo);
    card.append(top,body);
    L.appendChild(card);

    top.onclick=()=>{
      card.classList.toggle("open");
      top.querySelector(".arrow").textContent=card.classList.contains("open")?"−":"+";
    };
    more.onclick=()=>{
      card.classList.toggle("full");
      more.textContent=card.classList.contains("full")?"↑ Свернуть подробности":"↓ Подробно, с примерами";
    };
  });
})();

let lvl=1, ej=0, slots=[], chips=[], bien=0, total=0;

document.querySelectorAll(".lvl button").forEach(b=>{

const limpia=s=>s.toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u0302\u0304-\u036f]/g,"")
  .replace(/[¿?¡!.,]/g,"").replace(/\s+/g," ").trim();

function nuevo(){
  ej=Math.floor(Math.random()*EJER.length);
  const e=EJER[ej];
  $("task").textContent=e.ru;
  $("res").className="res";
  const area=$("area"); area.innerHTML="";

  if(lvl===3){
    const inp=document.createElement("input");
    inp.className="free"; inp.id="free";
    inp.setAttribute("autocapitalize","off");
    inp.setAttribute("autocomplete","off");
    inp.setAttribute("spellcheck","false");
    inp.placeholder="напишите по-испански";
    area.appendChild(inp);
    return;
  }

  const ocultos = lvl===1 ? [e.k] : e.es.map((_,i)=>i);
  slots = e.es.map((w,i)=> ocultos.includes(i) ? null : w);

  const sd=document.createElement("div"); sd.className="slots"; sd.id="slots";
  const cd=document.createElement("div"); cd.className="chips"; cd.id="chips";
  area.append(sd,cd);

  chips = mix(ocultos.map(i=>e.es[i]).concat(lvl===1?e.x.slice(0,2):e.x));
  render();
}

function render(){
  const e=EJER[ej];
  const sd=$("slots"), cd=$("chips");
  sd.innerHTML=""; cd.innerHTML="";

  slots.forEach((w,i)=>{
    const b=document.createElement("button");
    const fijo = lvl===1 && i!==e.k;
    b.className="slot"+(w?(fijo?" fix":""):" empty");
    b.textContent = w || "····";
    if(w && !fijo) b.onclick=()=>{ chips.push(w); slots[i]=null; render(); };
    sd.appendChild(b);
  });

  chips.forEach((w,i)=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=w;
    b.onclick=()=>{
      const k=slots.indexOf(null);
      if(k<0) return;
      slots[k]=w; chips.splice(i,1); render();
    };
    cd.appendChild(b);
  });
}

$("bCheck").onclick=()=>{
  const e=EJER[ej], correcto=e.es.join(" ");
  let mio;
  if(lvl===3){ mio=($("free")||{value:""}).value; }
  else{
    if(slots.includes(null)){
      $("res").className="res bad show";
      $("res").textContent="Заполните все места.";
      return;
    }
    mio=slots.join(" ");
  }
  total++;
  const r=$("res");
  if(limpia(mio)===limpia(correcto)){
    bien++;
    r.className="res good show";
    r.innerHTML="Верно. <b>"+correcto+"</b>";
  }else{
    r.className="res bad show";
    r.innerHTML="Не так. Правильно: <b>"+correcto+"</b>";
  }
  $("score").textContent="верно "+bien+" · всего "+total;
};

let cjOk=0, cjTot=0, cjResp=null;

function cjNuevo(){
  $("cjRes").className="res";
  const irr = Math.random()<0.4;
  const i = Math.floor(Math.random()*6);

  if(irr){
    const v = VERBOS[Math.floor(Math.random()*VERBOS.length)];
    const correcta = v.f[i][1];
    cjResp = correcta;
    $("cjStem").innerHTML = '<span style="color:var(--lap)">'+v.inf+'</span> → <u>?</u>';
    $("cjWho").textContent = QUIEN[i];
    $("cjHint").textContent = "неправильный глагол · "+v.tr;
    ponAyuda(tablaVerbo(v));
    pintaChips(mix(v.f.map(x=>x[1])), true);
  }else{
    const v = REG[Math.floor(Math.random()*REG.length)];
    const correcta = COLA[v.g][i];
    cjResp = correcta;
    $("cjStem").innerHTML = v.raiz+'<u>?</u>';
    $("cjWho").textContent = QUIEN[i];
    $("cjHint").textContent = v.inf+" · "+v.tr+" · группа -"+v.g;
    ponAyuda(tablaCola());
    const todas = [...new Set([].concat(COLA.ar,COLA.er,COLA.ir))];
    const otras = mix(todas.filter(x=>x!==correcta)).slice(0,5);
    pintaChips(mix(otras.concat([correcta])).map(x=>"-"+x), false, v.raiz);
  }
}

function pintaChips(lista, esForma, raiz){
  const c=$("cjChips"); c.innerHTML="";
  lista.forEach(t=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=t;
    b.onclick=()=>cjRevisa(t, esForma, raiz);
    c.appendChild(b);
  });
}

function cjRevisa(elegido, esForma, raiz){
  cjTot++;
  const limpio = esForma ? elegido : elegido.replace(/^-/,"");
  const r=$("cjRes");
  const palabra = esForma ? cjResp : raiz+cjResp;
  if(limpio===cjResp){
    cjOk++;
    r.className="res good show";
    r.innerHTML="Верно. <b>"+palabra+"</b>";
  }else{
    r.className="res bad show";
    r.innerHTML="Не так. Правильно: <b>"+palabra+"</b>";
    abreAyuda();
  }
  di(palabra);
  $("cjScore").textContent="верно "+cjOk+" · всего "+cjTot;
}

function tablaCola(){

function tablaVerbo(v){

/* ---------- память ---------- */
const LLAVE="frase_progreso";
function leerProg(){
  try{ const r=localStorage.getItem(LLAVE); if(r) return JSON.parse(r); }catch(e){}
  return {max:1,res:{}};
}
function guardarProg(p){
  try{ localStorage.setItem(LLAVE,JSON.stringify(p)); }catch(e){}
}
let PROG=leerProg();

/* ---------- список уровней ---------- */
function pintaRuta(){
  $("rutaLista").hidden=false; $("rutaDet").hidden=true; $("rutaEx").hidden=true;

  const hechos=Object.keys(PROG.res).length;
  const abierto=Math.min(PROG.max,NIVELES.length);
  const act=NIVELES.find(x=>x.n===abierto)||NIVELES[0];

  $("rTit").textContent="Ступень "+abierto+" — "+act.t;
  $("rSub").textContent="пройдено "+hechos+" из "+NIVELES.length;
  $("rBar").style.width=Math.round(hechos/NIVELES.length*100)+"%";

  const L=$("rNiv"); L.innerHTML="";
  NIVELES.forEach(v=>{
    const pasado=PROG.res[v.n]!==undefined;
    const libre=v.n<=PROG.max && !v.pronto;
    const b=document.createElement("button");
    b.className="niv"+(pasado?" hecho":"")+(!pasado&&libre?" ahora":"")+((!libre)?" cerrado":"");
    const est = pasado ? PROG.res[v.n]+"%" : (v.pronto ? "скоро" : (libre?"тест":"закрыт"));
    b.innerHTML='<span class="no"></span><span class="mid"><span class="tt"></span>'+
                '<span class="ds"></span></span><span class="st"></span>';
    b.querySelector(".no").textContent=v.n;
    b.querySelector(".tt").textContent=v.t;
    b.querySelector(".ds").textContent=v.d;
    b.querySelector(".st").textContent=est;
    b.onclick=()=>{ if(libre) verNivel(v); };
    L.appendChild(b);
  });

  $("rPie").textContent = PROG.max>=NIVELES.length ? "все ступени открыты"
      : "следующая откроется после теста ступени "+PROG.max;
}

/* ---------- карточка уровня ---------- */
function verNivel(v){
  $("rutaLista").hidden=true; $("rutaEx").hidden=true;
  const d=$("rutaDet"); d.hidden=false; d.innerHTML="";

  const pasado=PROG.res[v.n]!==undefined;
  d.innerHTML=
   '<div class="hdr"><div class="big">Ступень '+v.n+'</div>'+
   '<div class="small">'+v.d+'</div></div>'+
   '<p class="corto" style="margin-top:20px">'+(v.ver||"")+'</p>'+
   (pasado
     ? '<div class="nota" style="margin-top:20px"><span>пройдено</span><p>Тест сдан на '+PROG.res[v.n]+'%. Возвращайтесь и проходите заново когда захотите — прогресс не собьётся, засчитается лучший результат.</p></div>'
     : '')+
   '<div class="nota" style="margin-top:16px"><span>тест</span><p>15 заданий вперемешку: формы, перевод, аудирование, сборка фраз. Порог — 80%, то есть 12 правильных. Попыток сколько угодно.</p></div>'+
   '<div class="row"><button class="b" id="dAtras">Назад</button>'+
   '<button class="b pri" id="dEx">'+(pasado?"Пройти заново":"Пройти тест")+'</button></div>';

  $("dAtras").onclick=pintaRuta;
  $("dEx").onclick=()=>arrancaExamen(v);
}

/* ---------- экзамен ---------- */
let EX=null;

function arrancaExamen(v){
  const banco=BANCO[v.n]||[];
  const preg=mix(banco.slice()).slice(0,15);
  EX={niv:v,preg:preg,i:0,ok:0,fallos:[]};
  $("rutaLista").hidden=true; $("rutaDet").hidden=true; $("rutaEx").hidden=false;
  pintaPregunta();
}

function pintaPregunta(){
  const c=$("rutaEx"); c.innerHTML="";
  if(EX.i>=EX.preg.length){ pintaFinal(); return; }
  const q=EX.preg[EX.i];

  const h=document.createElement("div"); h.className="exHdr";
  h.innerHTML='<span>ступень '+EX.niv.n+'</span><span><b>'+(EX.i+1)+'</b> / '+EX.preg.length+'</span>';
  c.appendChild(h);

  const bar=document.createElement("div"); bar.className="barra";
  bar.innerHTML='<i style="width:'+Math.round(EX.i/EX.preg.length*100)+'%"></i>';
  c.appendChild(bar);

  if(q.t==="b"){ pintaSuelta(c,q); return; }

  const pr=document.createElement("div"); pr.className="exQ";
  pr.textContent = q.t==="a" ? "🔊 Прослушайте" : q.q;
  c.appendChild(pr);

  if(q.t==="a"){
    di(q.say);
    const rep=document.createElement("div");
    rep.style.cssText="display:flex;justify-content:center;margin-top:14px";
    rep.innerHTML='<button class="spk wide">🔊 Повторить</button>';
    rep.querySelector("button").onclick=()=>di(q.say);
    c.appendChild(rep);
  }else if(q.s){
    const sb=document.createElement("div"); sb.className="exSub"; sb.textContent=q.s; c.appendChild(sb);
  }

  const caja=document.createElement("div"); caja.style.marginTop="22px";
  const orden=mix(q.o.map((txt,k)=>({txt:txt,k:k})));
  orden.forEach(op=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=op.txt;
    b.onclick=()=>{
      caja.querySelectorAll(".opt").forEach(x=>x.classList.add("off"));
      const bien = op.k===q.a;
      b.classList.add(bien?"ok":"no");
      if(bien){ EX.ok++; }
      else{
        EX.fallos.push((q.t==="a"?q.say:q.q)+" → "+q.o[q.a]);
        caja.querySelectorAll(".opt").forEach(x=>{ if(x.textContent===q.o[q.a]) x.classList.add("ok"); });
      }
      diY(q.t==="a" ? null : q.o[q.a],
          ()=>{ EX.i++; pintaPregunta(); },
          bien?200:1500);
    };
    caja.appendChild(b);
  });
  c.appendChild(caja);
}

function pintaSuelta(c,q){
  const pr=document.createElement("div"); pr.className="exQ"; pr.textContent=q.q; c.appendChild(pr);
  const sb=document.createElement("div"); sb.className="exSub"; sb.textContent="соберите фразу"; c.appendChild(sb);

  let huecos=q.w.map(()=>null);
  let fichas=mix(q.w.concat(q.x));

  const sd=document.createElement("div"); sd.className="slots"; sd.style.marginTop="20px";
  const cd=document.createElement("div"); cd.className="chips";
  c.appendChild(sd); c.appendChild(cd);

  const fila=document.createElement("div"); fila.className="row";
  fila.innerHTML='<button class="b pri">Проверить</button>';
  c.appendChild(fila);

  function dibuja(){
    sd.innerHTML=""; cd.innerHTML="";
    huecos.forEach((w,i)=>{
      const b=document.createElement("button");
      b.className="slot"+(w?"":" empty"); b.textContent=w||"····";
      if(w) b.onclick=()=>{ fichas.push(w); huecos[i]=null; dibuja(); };
      sd.appendChild(b);
    });
    fichas.forEach((w,i)=>{
      const b=document.createElement("button"); b.className="chip"; b.textContent=w;
      b.onclick=()=>{ const k=huecos.indexOf(null); if(k<0)return;
        huecos[k]=w; fichas.splice(i,1); dibuja(); };
      cd.appendChild(b);
    });
  }
  dibuja();

  fila.querySelector("button").onclick=()=>{
    if(huecos.includes(null)) return;
    const correcto=q.w.join(" ");
    const bien = limpia(huecos.join(" "))===limpia(correcto);
    if(bien) EX.ok++; else EX.fallos.push(q.q+" → "+correcto);
    const r=document.createElement("div");
    r.className="res "+(bien?"good":"bad")+" show";
    r.innerHTML=(bien?"Верно. <b>":"Не так. Правильно: <b>")+correcto+"</b>";
    c.appendChild(r);
    fila.querySelector("button").disabled=true;
    sd.querySelectorAll("button").forEach(x=>x.onclick=null);
    cd.querySelectorAll("button").forEach(x=>x.onclick=null);
    diY(correcto, ()=>{ EX.i++; pintaPregunta(); }, bien?250:1600);
  };
}

function pintaFinal(){
  const c=$("rutaEx"); c.innerHTML="";
  const pct=Math.round(EX.ok/EX.preg.length*100);
  const pasa=pct>=80;

  if(pasa){
    const antes=PROG.res[EX.niv.n];
    if(antes===undefined||pct>antes) PROG.res[EX.niv.n]=pct;
    if(PROG.max===EX.niv.n && EX.niv.n<NIVELES.length) PROG.max=EX.niv.n+1;
    guardarProg(PROG);
    alimentarWidget();
  }

  const f=document.createElement("div"); f.className="fin";
  f.innerHTML='<div class="cifra '+(pasa?"ok":"no")+'">'+pct+'%</div>'+
    '<div class="txt">'+EX.ok+' из '+EX.preg.length+'<br>'+
    (pasa
      ? (EX.niv.n<NIVELES.length && !NIVELES[EX.niv.n].pronto
          ? "Ступень сдана. Открыта ступень "+(EX.niv.n+1)+"."
          : "Ступень сдана.")
      : "Порог 80%. Подтяните пропущенное и пройдите заново — попыток сколько угодно.")+
    '</div>';
  c.appendChild(f);

  if(EX.fallos.length){
    const d=document.createElement("div"); d.className="fallos";
    const h=document.createElement("h4"); h.textContent="что подтянуть"; d.appendChild(h);
    const ul=document.createElement("ul");
    EX.fallos.forEach(t=>{const li=document.createElement("li");li.textContent=t;ul.appendChild(li);});
    d.appendChild(ul); c.appendChild(d);
  }

  const row=document.createElement("div"); row.className="row";
  row.innerHTML='<button class="b" id="fSalir">К списку</button>'+
                '<button class="b pri" id="fOtra">Пройти заново</button>';
  c.appendChild(row);
  $("fSalir").onclick=pintaRuta;
  $("fOtra").onclick=()=>arrancaExamen(EX.niv);
}


/* ---------- отдаём материал виджету ---------- */
function alimentarWidget(){
  try{
    if(!(window.Android && window.Android.sincronizar)) return;
    const lote=[];

    // карточки-схемы
    FRASES.forEach(f=>{
      lote.push({
        e:f.w.map(x=>x[0]).join(" "),
        p:f.t,
        r:f.ru,
        s:f.say,
        n:1
      });
    });

    // предложения из текстов — по ступеням
    TEXTOS.forEach(t=>{
      t.es.forEach((linea,i)=>{
        if(linea.split(" ").length<=9){
          lote.push({e:linea,p:"текст · "+t.t,r:t.ru[i]||"",s:"",n:t.n});
        }
      });
    });

    // слова
    PALABRAS.forEach(w=>{
      lote.push({e:w.e,p:"слово · ступень "+w.n,r:w.r,s:"",n:w.n});
    });

    window.Android.sincronizar(JSON.stringify(lote), Math.min(PROG.max,7));
  }catch(e){}
}

const PALABRAS=[];
Object.keys(VOC).forEach(k=>{
  const n=parseInt(k,10);
  VOC[k].forEach(par=>{
    const t=par.split("|");
    if(t.length===2 && !PALABRAS.some(x=>x.e===t[0])) PALABRAS.push({e:t[0],r:t[1],n:n});
  });
});

const CAJA_LLAVE="frase_cajas";
let CAJAS={};
try{ const g=localStorage.getItem(CAJA_LLAVE); if(g) CAJAS=JSON.parse(g); }catch(e){}
function guardaCajas(){ try{ localStorage.setItem(CAJA_LLAVE,JSON.stringify(CAJAS)); }catch(e){} }

/* убираем острые ударения, но НЕ трогаем ñ */
function pelar(t){
  return String(t).toLowerCase().trim()
    .replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i")
    .replace(/ó/g,"o").replace(/ú/g,"u").replace(/ü/g,"u")
    .replace(/\s+/g," ");
}

let wdActual=null, wdModo=0, wdOk=0, wdTot=0;

function disponibles(){
  const tope = Math.min(PROG.max, 7);
  return PALABRAS.filter(p=>p.n<=tope);
}

function wdNueva(){
  $("wdRes").className="res";
  const lista=disponibles();
  if(!lista.length){ $("wdPregunta").textContent="—"; return; }

  // берём слова из самых слабых коробок
  let min=99;
  lista.forEach(p=>{ const c=CAJAS[p.e]||0; if(c<min) min=c; });
  const debiles=lista.filter(p=>(CAJAS[p.e]||0)<=Math.min(min+1,3));
  wdActual = debiles[Math.floor(Math.random()*debiles.length)];

  const caja = CAJAS[wdActual.e]||0;
  wdModo = caja<1 ? 0 : (caja<3 ? 1 : 2);

  $("wdCaja").textContent = "коробка "+caja+" из 4 · ступень "+wdActual.n;
  const area=$("wdArea"); area.innerHTML="";

  if(wdModo===0){
    $("wdPregunta").textContent=wdActual.e;
    $("wdSub").textContent="что это значит?";
    di(wdActual.e);
    opciones(area, wdActual.r, lista.map(p=>p.r), false);
  }
  else if(wdModo===1){
    $("wdPregunta").textContent=wdActual.r;
    $("wdSub").textContent="как по-испански?";
    opciones(area, wdActual.e, lista.map(p=>p.e), true);
  }
  else{
    $("wdPregunta").textContent="🔊";
    $("wdSub").textContent="напишите то, что слышите";
    di(wdActual.e);
    const inp=document.createElement("input");
    inp.className="free"; inp.id="wdInput";
    inp.setAttribute("autocapitalize","off");
    inp.setAttribute("autocomplete","off");
    inp.setAttribute("spellcheck","false");
    inp.placeholder="по-испански";
    area.appendChild(inp);

    const fila=document.createElement("div"); fila.className="row";
    fila.innerHTML='<button class="spk">🔊</button><button class="b pri">Проверить</button>';
    fila.querySelector(".spk").onclick=()=>di(wdActual.e);
    fila.querySelector(".b").onclick=()=>wdRevisa(inp.value, true);
    area.appendChild(fila);
    setTimeout(()=>inp.focus(),150);
  }
}

function opciones(area, correcta, todas, hablar){
  const otras = mix(todas.filter(x=>x!==correcta)).slice(0,3);
  mix(otras.concat([correcta])).forEach(t=>{
    const b=document.createElement("button"); b.className="opt"; b.textContent=t;
    b.onclick=()=>{
      area.querySelectorAll(".opt").forEach(x=>x.classList.add("off"));
      const bien = t===correcta;
      b.classList.add(bien?"ok":"no");
      if(!bien) area.querySelectorAll(".opt").forEach(x=>{ if(x.textContent===correcta) x.classList.add("ok"); });
      wdRevisa(t, false, correcta);
    };
    area.appendChild(b);
  });
}

function wdRevisa(dado, escrito, correcta){
  const esperado = escrito ? wdActual.e : correcta;
  const bien = escrito ? (pelar(dado)===pelar(esperado)) : (dado===esperado);

  wdTot++;
  const caja = CAJAS[wdActual.e]||0;
  CAJAS[wdActual.e] = bien ? Math.min(caja+1,4) : 0;
  guardaCajas();

  const r=$("wdRes");
  if(bien){
    wdOk++;
    r.className="res good show";
    r.innerHTML="Верно. <b>"+wdActual.e+"</b> — "+wdActual.r;
  }else{
    r.className="res bad show";
    r.innerHTML="Не так. <b>"+wdActual.e+"</b> — "+wdActual.r+
      (escrito?"<br><span style='font-size:14px'>вы написали: "+dado+"</span>":"");
  }
  di(wdActual.e);
  wdMarcador();
}

function wdMarcador(){
  const lista=disponibles();
  const sabidas=lista.filter(p=>(CAJAS[p.e]||0)>=4).length;
  $("wdScore").textContent="выучено "+sabidas+" из "+lista.length+
    " · сессия "+wdOk+"/"+wdTot;
}

$("wdNext").onclick=wdNueva;
wdMarcador();

function limpiaTok(t){
  return t.toLowerCase().replace(/[.,¿?¡!:;«»"()]/g,"");
}

/* поиск: точное совпадение, потом без ударений, потом попытка вернуть
   спрягнутую форму к словарной */
const COLAS=["o","as","a","amos","áis","an","es","e","emos","éis","en","imos","ís","s"];
function buscar(w){
  if(DICC[w]) return DICC[w];
  const pl=pelar(w);
  for(const k in DICC){ if(pelar(k)===pl) return DICC[k]; }
  // множественное число
  for(const c of ["es","s"]){
    if(pl.length>3 && pl.endsWith(c)){
      const sing=pl.slice(0,pl.length-c.length);
      for(const k in DICC){ if(pelar(k)===sing) return DICC[k]; }
    }
  }
  for(const c of COLAS){
    if(pl.endsWith(c)){
      const raiz=pl.slice(0,pl.length-c.length);
      for(const inf of [raiz+"ar",raiz+"er",raiz+"ir"]){
        for(const k in DICC){ if(pelar(k)===inf) return DICC[k]+" (форма)"; }
      }
    }
  }
  return null;
}

function pintaTexto(){
  const libres=TEXTOS.filter(t=>t.n<=Math.min(PROG.max,7));
  if(txActual>=libres.length) txActual=0;
  const T=libres[txActual];

  $("txCaja").textContent="ступень "+T.n+" · текст "+(txActual+1)+" из "+libres.length;
  $("txTit").textContent=T.t;

  const c=$("txCuerpo"); c.innerHTML="";
  T.es.forEach((linea,li)=>{
    const p=document.createElement("p"); p.className="lin";
    linea.split(" ").forEach(w=>{
      const sp=document.createElement("span"); sp.className="pal"; sp.textContent=w;
      sp.onclick=()=>{
        const k=limpiaTok(w);
        const tr=buscar(k);
        $("txPop").innerHTML='<b>'+k+'</b> — '+(tr||"нет в словаре");
        $("txPop").classList.add("show");
        di(k);
      };
      p.appendChild(sp);
      p.appendChild(document.createTextNode(" "));
    });
    if(txRu){
      const r=document.createElement("p"); r.className="linru"; r.textContent=T.ru[li];
      p.appendChild(r);
    }
    c.appendChild(p);
  });
  $("txPop").classList.remove("show");
}

$("txRu").onclick=()=>{
  txRu=!txRu;
  $("txRu").textContent = txRu ? "Скрыть перевод" : "Перевод";
  pintaTexto();
};
$("txOir").onclick=()=>{
  const libres=TEXTOS.filter(t=>t.n<=Math.min(PROG.max,7));
  di(libres[txActual].es.join(" "));
};
$("txNext").onclick=()=>{
  const libres=TEXTOS.filter(t=>t.n<=Math.min(PROG.max,7));
  txActual=(txActual+1)%libres.length;
  pintaTexto();
  document.querySelector("main").scrollTop=0;
};
